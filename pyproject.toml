[project]
name = "mellow-code"
version = "0.1.0"
description = "AI-powered multi-agent coding assistant built with LangGraph"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "groq>=0.31.0",
    "langchain>=0.3.27",
    "langchain-core>=0.3.72",
    "langchain-groq>=0.3.7",
    "langgraph>=0.6.3",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "sse-starlette>=2.0.0",
    "uvicorn>=0.28.0",
]

[tool.setuptools.packages.find]
include = ["agent*"]
