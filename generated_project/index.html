<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <calculator>
            <div class="display-screen" id="display-screen"></div>
            <button class="keypad-button" id="clear">C</button>
            <button class="keypad-button" id="backspace">DEL</button>
            <button class="keypad-button" id="divide">/</button>
            <button class="keypad-button" id="7">7</button>
            <button class="keypad-button" id="8">8</button>
            <button class="keypad-button" id="9">9</button>
            <button class="keypad-button" id="multiply">*</button>
            <button class="keypad-button" id="4">4</button>
            <button class="keypad-button" id="5">5</button>
            <button class="keypad-button" id="6">6</button>
            <button class="keypad-button" id="subtract">-</button>
            <button class="keypad-button" id="1">1</button>
            <button class="keypad-button" id="2">2</button>
            <button class="keypad-button" id="3">3</button>
            <button class="keypad-button" id="add">+</button>
            <button class="keypad-button" id="0">0</button>
            <button class="keypad-button" id="decimal">.</button>
            <button class="keypad-button" id="equals">=</button>
        </calculator>
    </main>
    <script src="script.js"></script>
</body>
</html>
