<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <input type="text" id="display-screen" class="display-screen" disabled>
        <button id="button-7" class="keypad-button">7</button>
        <button id="button-8" class="keypad-button">8</button>
        <button id="button-9" class="keypad-button">9</button>
        <button id="button-divide" class="keypad-button">/</button>
        <button id="button-4" class="keypad-button">4</button>
        <button id="button-5" class="keypad-button">5</button>
        <button id="button-6" class="keypad-button">6</button>
        <button id="button-multiply" class="keypad-button">*</button>
        <button id="button-1" class="keypad-button">1</button>
        <button id="button-2" class="keypad-button">2</button>
        <button id="button-3" class="keypad-button">3</button>
        <button id="button-subtract" class="keypad-button">-</button>
        <button id="button-0" class="keypad-button">0</button>
        <button id="button-decimal" class="keypad-button">.</button>
        <button id="button-equals" class="keypad-button">=</button>
        <button id="button-add" class="keypad-button">+</button>
        <button id="button-clear" class="keypad-button">Clear</button>
        <button id="button-delete" class="keypad-button">Delete</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
